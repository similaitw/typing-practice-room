25 592 Z" /><rect class="nail" x="154.25" y="468" width="20" height="23" rx="8" /><circle class="left" cx="164.25" cy="515" r="15" /><text class="badge" x="164.25" y="521">A</text><text class="small" x="164.25" y="444" text-anchor="middle">小指</text><rect class="nail" x="213.25" y="449" width="20" height="23" rx="8" /><circle class="left" cx="223.25" cy="496" r="15" /><text class="badge" x="223.25" y="502">S</text><text class="small" x="223.25" y="425" text-anchor="middle">無名指</text><rect class="nail" x="272.25" y="438" width="20" height="23" rx="8" /><circle class="left" cx="282.25" cy="485" r="15" /><text class="badge" x="282.25" y="491">D</text><text class="small" x="282.25" y="414" text-anchor="middle">中指</text><rect class="nail" x="331.25" y="453" width="20" height="23" rx="8" /><circle class="left" cx="341.25" cy="500" r="15" /><text class="badge" x="341.25" y="506">F</text><text class="small" x="341.25" y="429" text-anchor="middle">食指</text><rect class="nail" x="508.25" y="453" width="20" height="23" rx="8" /><circle class="right" cx="518.25" cy="500" r="15" /><text class="badge" x="518.25" y="506">J</text><text class="small" x="518.25" y="429" text-anchor="middle">食指</text><rect class="nail" x="567.25" y="438" width="20" height="23" rx="8" /><circle class="right" cx="577.25" cy="485" r="15" /><text class="badge" x="577.25" y="491">K</text><text class="small" x="577.25" y="414" text-anchor="middle">中指</text><rect class="nail" x="626.25" y="449" width="20" height="23" rx="8" /><circle class="right" cx="636.25" cy="496" r="15" /><text class="badge" x="636.25" y="502">L</text><text class="small" x="636.25" y="425" text-anchor="middle">無名指</text><rect class="nail" x="685.25" y="468" width="20" height="23" rx="8" /><circle class="right" cx="695.25" cy="515" r="15" /><text class="badge" x="695.25" y="521">;</text><text class="small" x="695.25" y="444" text-anchor="middle">小指</text><text class="label" x="252.75" y="617">左手</text><text class="label" x="606.75" y="617">右手</text><path class="leader" stroke="#836548" d="M406 500 V371 M453 500 V371" /><rect x="380" y="387" width="147" height="29" rx="14" fill="#fffdf7" stroke="#bbc4ba" /><text x="453" y="407" class="label" style="font-size:14px">兩隻拇指 → 空白鍵</text><rect x="735" y="430" width="193" height="159" rx="12" fill="#fffdf7" stroke="#bbc4ba" /><text x="751" y="460" font-size="16" font-weight="700">先找 F、J 的凸點</text><text x="751" y="489" font-size="14">食指定位後，其他手指</text><text x="751" y="512" font-size="14">自然排開，指尖輕放。</text><text x="751" y="550" font-size="14">手指微彎，不要伸直</text><text x="751" y="573" font-size="14">或用力壓住按鍵。</text><text x="480" y="730" text-anchor="middle" font-size="16" font-weight="700">左手 A S D F　｜　右手 J K L ;　｜　拇指 空白鍵</text><text x="480" y="764" text-anchor="middle" font-size="14">圖中雙手移到鍵盤下方，方便看清楚；實際練習時把指尖放到虛線連接的按鍵上。</text><text x="480" y="789" text-anchor="middle" font-size="12">不同鍵盤的 Enter／Shift 外形可能不同，英文基準鍵位置相同。</text><text x="61.0" y="88" class="letter" style="font-size:15px;fill:#225c45">~</text><text x="120.0" y="88" class="letter" style="font-size:15px;fill:#225c45">!</text><text x="179.0" y="88" class="letter" style="font-size:15px;fill:#225c45">@</text><text x="238.0" y="88" class="letter" style="font-size:15px;fill:#225c45">#</text><text x="297.0" y="88" class="letter" style="font-size:15px;fill:#225c45">$</text><text x="356.0" y="88" class="letter" style="font-size:15px;fill:#225c45">%</text><text x="415.0" y="88" class="letter" style="font-size:15px;fill:#225c45">^</text><text x="474.0" y="88" class="letter" style="font-size:15px;fill:#225c45">&amp;</text><text x="533.0" y="88" class="letter" style="font-size:15px;fill:#225c45">*</text><text x="592.0" y="88" class="letter" style="font-size:15px;fill:#225c45">(</text><text x="651.0" y="88" class="letter" style="font-size:15px;fill:#225c45">)</text><text x="710.0" y="88" class="letter" style="font-size:15px;fill:#225c45">_</text><text x="769.0" y="88" class="letter" style="font-size:15px;fill:#225c45">+</text><text x="739.5" y="148" class="letter" style="font-size:15px;fill:#225c45">{</text><text x="798.5" y="148" class="letter" style="font-size:15px;fill:#225c45">}</text><text x="872.25" y="148" class="letter" style="font-size:15px;fill:#225c45">|</text><text x="695.25" y="208" class="letter" style="font-size:15px;fill:#225c45">:</text><text x="754.25" y="208" class="letter" style="font-size:15px;fill:#225c45">"</text><text x="606.75" y="268" class="letter" style="font-size:15px;fill:#225c45">&lt;</text><text x="665.75" y="268" class="letter" style="font-size:15px;fill:#225c45">&gt;</text><text x="724.75" y="268" class="letter" style="font-size:15px;fill:#225c45">?</text></svg>