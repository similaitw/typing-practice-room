<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 810" role="img" aria-labelledby="title desc">
<title id="title">鍵盤與雙手基準位置圖</title>
<desc id="desc">從自己低頭看鍵盤的方向：左手小指 A、無名指 S、中指 D、食指 F；右手食指 J、中指 K、無名指 L、小指分號。兩隻拇指放在空白鍵上方。虛線連接每個手指與負責的基準鍵。F 與 J 下方有定位凸點。鍵帽上排包含大括號、直線、冒號、雙引號、小於、大於與問號，按住 Shift 輸入。</desc>
<style>text{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#17231d}.key{fill:#fffdf7;stroke:#bbc4ba;stroke-width:1.5}.letter{font-size:18px;font-weight:600;text-anchor:middle}.small{font-size:12px}.label{font-size:17px;font-weight:700;text-anchor:middle}.left{fill:#dcebcf;stroke:#225c45;stroke-width:2}.right{fill:#fce1ce;stroke:#a44b28;stroke-width:2}.leader{fill:none;stroke-width:2;stroke-dasharray:5 5}.skin{fill:#f2d5b8;stroke:#836548;stroke-width:2.5;stroke-linejoin:round}.nail{fill:#fff5e7;stroke:#b58e6a;stroke-width:1}.badge{font-size:16px;font-weight:700;text-anchor:middle}</style>
<rect width="960" height="810" rx="20" fill="#f5f2e9" />
