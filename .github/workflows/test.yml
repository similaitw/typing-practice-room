name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Node tests
        run: node --test tests/core.test.cjs tests/teacher-auth.test.cjs tests/records-auth.test.cjs tests/students-api.test.cjs tests/assignments.test.cjs tests/assignment-dashboard.test.cjs tests/mistake-analysis.test.cjs tests/weak-key-practice.test.cjs tests/progress.test.cjs tests/growth-analytics.test.cjs tests/report.test.cjs tests/my-records.test.cjs
      - name: Syntax checks
        run: |
          node --check app.js
          node --check core.js
          node --check data.js
          node --check teacher-auth.js
          node --check cloud-students.js
          node --check assignments.js
          node --check assignment-dashboard.js
          node --check mistake-analytics.js
          node --check weak-key-core.js
          node --check weak-key-practice.js
          node --check cloud-progress.js
          node --check growth-analytics.js
          node --check report.js
          node --check my-records.js
          node --check api/records.js
          node --check api/students.js
          node --check api/assignments.js
          node --check api/assignment-dashboard.js
          node --check api/student-access.js
          node --check api/mistake-analytics.js
          node --check api/progress.js
          node --check api/growth-analytics.js
          node --check api/report.js
          node --check api/my-records.js
          node --check lib/typing-schema.js
          node --check lib/student-session.js
          node --check lib/mistake-analysis.js
          node --check lib/lesson-catalog.js
          node --check lib/progress-schema.js
          node --check lib/growth-analysis.js
          node --check lib/report-analysis.js
          node --check lib/student-history.js
